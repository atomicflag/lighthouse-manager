[package]
name = "lighthouse-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/atomicflag/lighthouse-manager"
keywords = ["lighthouse", "steamvr", "basestation"]
categories = ["hardware-support"]
readme = "README.md"
description = "Control SteamVR Lighthouse base stations (V1 & V2) via Bluetooth LE"


[[bin]]
name = "lighthouse-manager"
path = "src/cli/main.rs"

[[bin]]
name = "lighthouse-manager-ovr"
path = "src/ovr/main.rs"

[lib]
name = "lighthouse_manager"
path = "src/lib.rs"

[dependencies]
btleplug = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-aux = { version = "4", default-features = false }
serde_json = "1"
jsonc-parser = { version = "0.33", features = ["serde"] }
directories = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
openvr = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true

[lints.clippy]
pedantic = "warn"
